<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컴공생 시뮬레이터</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* 파스텔 스티커 스타일: 부드러운 외곽선 + 파스텔 색 + 코드 에디터 패널 + 마스코트 */
  :root {
    --ink: #3f3d56;
    --muted: #7a7891;
    --line: #3f3d56;
    --sky: #cdeafe;
    --sky-mid: #b3dcf7;
    --sky-deep: #7fb6e0;
    --pink: #ffd6e5;
    --lav: #e6e0ff;
    --mint: #d3f5e6;
    --lemon: #fff3bf;
    --peach: #ffe2d1;
    --panel: #f0efff;
    --code-text: #a9a6c9;
    --kw: #7d9bea;
    --str: #ee8aa8;
    --stroke: 2.5px solid var(--line);
    --pop: 4px 4px 0 var(--line);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    background:
      radial-gradient(rgba(127, 182, 224, .22) 1.2px, transparent 1.2px) 0 0 / 22px 22px,
      linear-gradient(180deg, #fff1f7 0%, #eef6ff 45%, #f0fbf5 100%) fixed;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  #app { width: 100%; max-width: 480px; padding: 20px 16px 48px; }
  .screen { display: none; animation: fade .25s ease; }
  .screen.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .logo { display: block; height: 38px; width: auto; }

  /* 두 겹 테두리 알약 타이틀 */
  .pill-title {
    display: block; text-align: center; margin: 18px auto 0; padding: 14px 20px;
    background: var(--sky); border: var(--stroke); border-radius: 999px;
    box-shadow: inset 0 0 0 6px var(--sky-mid), inset 0 0 0 8px var(--sky-deep), var(--pop);
    font-family: 'Black Han Sans', sans-serif; font-weight: 400; font-size: 30px; letter-spacing: 1px; color: var(--ink);
    text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff;
  }
  h1 { font-family: 'Jua', sans-serif; font-size: 28px; font-weight: 400; }
  h2 { font-family: 'Jua', sans-serif; font-size: 20px; font-weight: 400; margin-bottom: 14px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 12px; text-align: center; word-break: keep-all; }
  .card { background: #fff; border: var(--stroke); border-radius: 22px; padding: 20px; box-shadow: var(--pop); margin-top: 18px; }

  label { display: block; font-family: 'Jua', sans-serif; font-size: 16px; margin: 14px 0 6px; }
  input, select {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 15px;
    border: 2px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink);
  }
  input:focus, select:focus { outline: none; background: #f7fbff; box-shadow: 0 0 0 3px var(--sky); }
  .avatars { display: flex; gap: 8px; flex-wrap: wrap; }
  .avatars button {
    font-size: 26px; width: 52px; height: 52px; border-radius: 16px;
    border: 2px solid var(--line); background: #fff; cursor: pointer;
  }
  .avatars button.sel { background: var(--pink); box-shadow: 3px 3px 0 var(--line); transform: translate(-1px, -1px); }

  .btn {
    display: block; width: 100%; padding: 14px; margin-top: 14px;
    font-family: 'Jua', sans-serif; font-size: 19px; border: var(--stroke); border-radius: 999px;
    background: var(--sky); color: var(--ink); cursor: pointer;
    box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .55), var(--pop); transition: transform .08s, box-shadow .08s, filter .15s;
  }
  .btn:hover { filter: brightness(1.03) saturate(1.1); }
  .btn:active { transform: translate(3px, 3px); box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .55), 1px 1px 0 var(--line); }
  .btn.pink { background: var(--pink); }
  .btn.mint { background: var(--mint); }
  .btn.lav { background: var(--lav); }
  .btn.ghost { background: #fff; }
  .btn.small { padding: 10px; font-size: 16px; }
  .error { color: #e0607e; font-size: 13px; margin-top: 8px; min-height: 18px; }

  /* 코드 에디터 패널 + 캐릭터 + 말풍선 */
  .code-panel {
    position: relative; background: var(--panel); border-radius: 26px; overflow: hidden;
    height: 230px; display: grid; place-items: center; border: var(--stroke);
  }
  .code-panel pre {
    position: absolute; inset: 0; padding: 16px 18px; margin: 0;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.75;
    color: var(--code-text); white-space: pre; text-align: left; pointer-events: none;
  }
  .code-panel .kw { color: var(--kw); }
  .code-panel .str { color: var(--str); }
  .code-panel .char {
    position: relative; z-index: 1; font-size: 104px; line-height: 1;
    filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(4px 5px 0 rgba(63, 61, 86, .18));
  }
  .code-panel .mascot {
    position: absolute; z-index: 1; bottom: -2px; left: 50%; transform: translateX(-50%); height: 94%; width: auto;
    filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(5px 5px 0 rgba(63, 61, 86, .15));
  }
  .code-panel .badge {
    position: absolute; z-index: 2; left: 16px; bottom: 14px; font-size: 54px; line-height: 1;
    filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(3px 4px 0 rgba(63, 61, 86, .2));
  }
  .code-panel .cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
  .speech {
    position: absolute; z-index: 2; right: 14px; top: 18px; max-width: 40%;
    background: #fff; color: var(--ink); border: var(--stroke); border-radius: 40px;
    padding: 10px 14px; font-family: 'JetBrains Mono', 'Jua', monospace; font-size: 14px; line-height: 1.35;
    text-align: center; white-space: pre-line; word-break: keep-all;
  }
  .speech::before {
    content: ''; position: absolute; left: -11px; bottom: 12px; width: 18px; height: 16px;
    background: #fff; border-left: var(--stroke); border-bottom: var(--stroke);
    border-radius: 0 0 0 14px; transform: skewX(20deg);
  }
  .code-panel.locked { background: #e9e7ef; }
  .code-panel.locked pre { opacity: .5; }
  .code-panel.locked .char { opacity: .45; filter: grayscale(1); }

  /* 홈 */
  .profile { display: flex; align-items: center; gap: 14px; }
  .profile .ava { font-size: 40px; width: 66px; height: 66px; border-radius: 20px; background: var(--pink); border: var(--stroke); display: grid; place-items: center; flex-shrink: 0; }
  .profile .name { font-family: 'Jua', sans-serif; font-size: 22px; }
  .profile .meta { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--sky); border: 2px solid var(--line); }
  .chip.lav { background: var(--lav); }
  .collect-bar { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .bar { height: 14px; background: #fff; border: 2px solid var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--pink), var(--sky-mid)); transition: width .4s; }

  /* 게임 */
  .topbar { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--muted); font-family: 'Jua', sans-serif; }
  .topbar button { background: none; border: none; color: var(--muted); font: inherit; cursor: pointer; }
  .year-badge { display: inline-block; background: var(--lav); color: var(--ink); border: 2px solid var(--line); font-family: 'Jua', sans-serif; font-size: 15px; padding: 4px 14px; border-radius: 99px; margin: 16px 0 10px; }
  .question-bubble {
    position: relative; margin-top: 22px; background: #fff; border: var(--stroke); border-radius: 26px;
    padding: 18px 16px; box-shadow: var(--pop);
  }
  .question-bubble::before {
    content: ''; position: absolute; top: -13px; left: 50%; width: 22px; height: 22px; margin-left: -11px;
    background: #fff; border-left: var(--stroke); border-top: var(--stroke); transform: rotate(45deg);
  }
  .question { font-family: 'Jua', sans-serif; font-size: 21px; line-height: 1.5; text-align: center; word-break: keep-all; }
  .options { margin-top: 20px; display: grid; gap: 12px; }
  .option {
    text-align: left; padding: 15px 16px; font: inherit; font-size: 15px; line-height: 1.45;
    background: #fff; border: var(--stroke); border-radius: 18px; box-shadow: 3px 3px 0 var(--line);
    cursor: pointer; color: var(--ink); position: relative; word-break: keep-all; transition: transform .08s, box-shadow .08s, background .15s;
  }
  .option:nth-child(4n+1):hover { background: var(--pink); }
  .option:nth-child(4n+2):hover { background: var(--sky); }
  .option:nth-child(4n+3):hover { background: var(--mint); }
  .option:nth-child(4n+4):hover { background: var(--lav); }
  .option:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--line); }
  .option.hint { background: var(--lemon); }
  .option.hint::after {
    content: '💡 추천'; position: absolute; top: -11px; right: 12px;
    background: #ffe98f; color: var(--ink); border: 2px solid var(--line); font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px;
  }
  .target-note { margin-top: 12px; font-size: 13px; text-align: center; background: var(--lemon); border: 2px solid var(--line); padding: 8px; border-radius: 14px; }

  /* 도감 */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 18px; }
  .rcard {
    background: #fff; border: var(--stroke); border-radius: 20px; padding: 10px 10px 12px; text-align: center;
    box-shadow: var(--pop); cursor: pointer; font: inherit; color: var(--ink); transition: transform .08s, box-shadow .08s;
  }
  .rcard:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--line); }
  .rcard .code-panel { height: 100px; border-radius: 14px; border-width: 2px; }
  .rcard .code-panel pre { font-size: 8px; padding: 8px; }
  .rcard .code-panel .char { font-size: 48px; }
  .rcard .t { font-family: 'Jua', sans-serif; font-size: 16px; margin-top: 10px; }
  .rcard .c { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .history { margin-top: 8px; }
  .history li { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 2px dashed #e1def0; font-size: 14px; cursor: pointer; }
  .history li:last-child { border-bottom: none; }
  .history .d { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 16px 0; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .link { background: none; border: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; }

  /* 팝업 */
  .overlay {
    position: fixed; inset: 0; background: rgba(63, 61, 86, .42); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .overlay.open { display: flex; animation: fade .2s ease; }
  .modal {
    background: #fffdfd; width: 100%; max-width: 420px; max-height: 92vh; overflow-y: auto;
    border: var(--stroke); border-radius: 28px; padding: 20px; position: relative; box-shadow: 6px 6px 0 var(--line);
    animation: pop .3s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .close {
    position: absolute; top: 12px; right: 12px; z-index: 3; width: 34px; height: 34px; border-radius: 50%;
    background: var(--pink); border: 2px solid var(--line); font-size: 15px; font-weight: 700; cursor: pointer; color: var(--ink);
  }
  .modal .code-panel { margin-top: 30px; }
  .modal .who { text-align: center; color: var(--muted); font-size: 14px; margin-top: 16px; }
  .modal .pill-title { font-size: 26px; margin-top: 8px; }
  .modal .desc { font-size: 15px; line-height: 1.7; margin-top: 14px; word-break: keep-all; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
  .tags span { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--pink); border: 2px solid var(--line); }
  .tags span:nth-child(2) { background: var(--sky); }
  .tags span:nth-child(3) { background: var(--mint); }
  .stats { margin-top: 16px; }
  .stat { display: grid; grid-template-columns: 96px 1fr 22px; align-items: center; gap: 8px; font-size: 12px; margin-top: 7px; }
  .stat .bar { margin: 0; height: 12px; }
  .guide { margin-top: 18px; background: var(--panel); border: var(--stroke); border-radius: 20px; padding: 16px; }
  .guide h3 { font-family: 'Jua', sans-serif; font-weight: 400; font-size: 18px; margin-bottom: 10px; }
  .guide ol { padding-left: 20px; font-size: 14px; line-height: 1.6; }
  .guide li { margin-bottom: 8px; }
  .guide li::marker { color: var(--kw); font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .guide .q { color: var(--kw); font-size: 12px; display: block; font-family: 'JetBrains Mono', 'Noto Sans KR', monospace; }
  .guide .tip { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .saved { text-align: center; font-size: 13px; margin-top: 12px; font-weight: 700; color: #3f9c73; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }
</style>
</head>
<body>
<div id="app">

  <!-- 1. 프로필 설정 -->
  <section class="screen" id="s-profile">
    <img class="logo" src="images/inha_logo_new.png" alt="INHA INSTAR">
    <div id="p-hero" style="margin-top:16px"></div>
    <h1 class="pill-title">반가워요, 새내기!</h1>
    <p class="sub">대학 생활을 시작하기 전에 프로필을 만들어 주세요.</p>
    <div class="card">
      <label for="p-name">이름</label>
      <input id="p-name" maxlength="10" placeholder="예: 김코딩">

      <label for="p-major">학과</label>
      <select id="p-major">
        <option value="컴퓨터공학과">컴퓨터공학과</option>
        <option disabled>전자공학과 (준비 중)</option>
        <option disabled>경영학과 (준비 중)</option>
      </select>

      <label for="p-id">학번</label>
      <select id="p-id"></select>

      <label>캐릭터</label>
      <div class="avatars" id="p-avatars"></div>

      <p class="error" id="p-error"></p>
      <button class="btn" id="p-save">저장하고 시작하기</button>
    </div>
  </section>

  <!-- 2. 홈 -->
  <section class="screen" id="s-home">
    <img class="logo" src="images/inha_logo_new.png" alt="INHA INSTAR">
    <div id="h-hero" style="margin-top:16px"></div>
    <h1 class="pill-title">컴공생 시뮬레이터</h1>
    <p class="sub">4년 동안의 선택이 당신을 어떤 컴공생으로 만들까요?</p>
    <div class="card">
      <div class="profile">
        <div class="ava" id="h-ava"></div>
        <div>
          <div class="name" id="h-name"></div>
          <div class="meta" id="h-meta"></div>
        </div>
      </div>
      <div class="collect-bar">
        <span id="h-collect"></span>
        <div class="bar"><div id="h-collect-bar"></div></div>
      </div>
    </div>
    <button class="btn" id="h-start">🎓 입학하기 (게임 시작)</button>
    <button class="btn pink" id="h-collection">📖 결과 도감</button>
    <button class="btn mint" id="h-edit">✏️ 프로필 수정</button>
  </section>

  <!-- 3. 게임 -->
  <section class="screen" id="s-game">
    <div class="topbar">
      <button id="g-quit">← 그만두기</button>
      <span id="g-count"></span>
    </div>
    <div class="bar"><div id="g-bar"></div></div>
    <div id="g-target"></div>
    <span class="year-badge" id="g-year"></span>
    <div id="g-scene"></div>
    <div class="question-bubble"><p class="question" id="g-question"></p></div>
    <div class="options" id="g-options"></div>
  </section>

  <!-- 4. 결과 도감 -->
  <section class="screen" id="s-collection">
    <div class="topbar"><button id="c-back">← 홈으로</button></div>
    <h1 class="pill-title">결과 도감</h1>
    <p class="sub">카드를 누르면 그 결과가 나오는 방법을 알려드려요.</p>
    <div class="grid" id="c-grid"></div>
    <div class="card">
      <div class="row">
        <h2 style="margin:0">🕘 지난 결과 기록</h2>
        <button class="link" id="c-clear">기록 삭제</button>
      </div>
      <ul class="history" id="c-history"></ul>
    </div>
  </section>
</div>

<!-- 결과 / 가이드 팝업 -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
/* =========================================================
 *  데이터
 *  - 결과 이미지를 직접 넣고 싶으면 image: 'images/debugger.png' 처럼 경로를 적으면 됩니다.
 *    비워두면 이모지 일러스트가 자동으로 그려집니다.
 * ========================================================= */
const TYPES = {
  debugger: {
    name: '밤샘 디버거', emoji: '🦉', color: ['#c3bdff', '#9d95f0'], image: '',
    desc: '새벽 4시, 모두가 잠든 시간에 당신의 눈은 가장 빛납니다. 아무도 못 잡는 버그도 끝까지 추적해 잡아내는 끈기의 소유자. 팀에 한 명씩은 꼭 필요한 든든한 해결사예요.',
    tags: ['#끈기', '#올나이트', '#printf장인'],
    line: '버그\n잡았다!', code: 'fix(segfault);',
  },
  algo: {
    name: '알고리즘 마스터', emoji: '🏆', color: ['#ffe08f', '#f5c451'], image: '',
    desc: '시간 복잡도를 보면 가슴이 뛰는 당신. 백준 티어가 곧 자존심이고, 코딩테스트는 두렵지 않습니다. 논리적이고 효율적인 사고로 어떤 문제든 최적해를 찾아내요.',
    tags: ['#백준', '#O(logN)', '#코테프리패스'],
    line: 'O(log n)\n가능?', code: 'solve(n, dp);',
  },
  startup: {
    name: '스타트업 CEO', emoji: '🚀', color: ['#ffb8b8', '#f28b8b'], image: '',
    desc: '코드는 수단일 뿐, 당신의 목표는 세상을 바꾸는 서비스! 아이디어를 빠르게 실행으로 옮기고 사람들을 이끄는 리더십이 있어요. 언젠가 당신의 앱을 모두가 쓰게 될지도?',
    tags: ['#실행력', '#피치덱', '#리더십'],
    line: '투자\n받자!', code: 'launch(mvp);',
  },
  design: {
    name: '프론트엔드 장인', emoji: '🎨', color: ['#ffc6e0', '#f59cc4'], image: '',
    desc: '1px 어긋난 것도 참을 수 없는 섬세한 감각의 소유자. 사용자가 보는 화면을 아름답고 편리하게 만드는 데 진심입니다. 당신이 만든 페이지는 들어가는 순간 "와" 소리가 나요.',
    tags: ['#픽셀퍼펙트', '#CSS마법사', '#UX'],
    line: '1px\n틀렸어!', code: 'align(center);',
  },
  ai: {
    name: 'AI 연구자', emoji: '🤖', color: ['#aeeacc', '#7fd3aa'], image: '',

const TYPE_ORDER = ['debugger', 'algo', 'startup', 'design', 'ai', 'chill'];

// 각 선택지의 score: 해당 결과 유형에 더해지는 점수
const QUESTIONS = [

  ]},
  { year: '3학년 가을', emoji: '🧰', q: '내가 가장 사랑하는\n개발 도구는?', options: [

  ]},
  { year: '졸업식', emoji: '🔮', q: '10년 후의 나는\n어떤 모습일까?', options: [
    { t: '장애가 나면 제일 먼저 불려가는 해결사', score: { debugger: 2 } },
    { t: '세계 대회 수상 경력의 알고리즘 고수', score: { algo: 2 } },
    { t: '유명 학회에 논문을 낸 연구자', score: { ai: 2 } },
    { t: '제주도 바닷가 카페 사장님', score: { chill: 2 } },

];

const MASCOT = 'images/mascot_new.png';
const AVATARS = ['🧑‍💻', '👩‍💻', '👨‍💻', '🐱', '🐶', '🐰'];
const KEY_PROFILE = 'csgame_profile';
const KEY_RESULTS = 'csgame_results';

/* ========================= 저장소 ========================= */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  },
  remove(key) { try { localStorage.removeItem(key); } catch {} },
};

let profile = store.get(KEY_PROFILE, null);
let results = store.get(KEY_RESULTS, []);
let game = null; // { index, scores, target }

/* ========================= 공통 ========================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function show(id) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === id));
  window.scrollTo(0, 0);
}

function codeLines(call) {
  return [
    '<span class="kw">#include</span> &lt;stdio.h&gt;',
    '',
    '<span class="kw">int</span> main() {',
    '  <span class="kw">int</span> i, j;',
    '  <span class="kw">for</span>( i = 0; i &lt; 4; i++ ) {',
    `    ${esc(call)}`,
    '    printf(<span class="str">"hello world"</span>);',
    '  }',
    '}',
  ].join('\n');
}

// 코드 에디터 패널 위에 캐릭터(마스코트 또는 이모지)와 말풍선을 올린 그림
function panelHTML({ emoji, line, call = 'study();', locked = false, image = '', mascot = false }) {
  let figure;
  if (image) figure = `<img class="cover" src="${esc(image)}" alt="">`;
  else if (mascot) figure = `<img class="mascot" src="${MASCOT}" alt="안뇽이">${emoji ? `<span class="badge">${emoji}</span>` : ''}`;
  else figure = `<span class="char">${emoji}</span>`;
  return `
    <div class="code-panel ${locked ? 'locked' : ''}">
      <pre aria-hidden="true">${codeLines(call)}</pre>
      ${figure}
      ${line ? `<div class="speech">${esc(line)}</div>` : ''}
    </div>`;
}

function artHTML(key, locked = false) {
  const t = TYPES[key];
  if (locked) return panelHTML({ emoji: '❓', line: '???', call: 'unlock();', locked: true });
  return panelHTML({ mascot: true, emoji: t.emoji, line: t.line, call: t.code, image: t.image });
}

/* ========================= 프로필 ========================= */
let pickedAvatar = AVATARS[0];

function openProfile() {
  const sel = $('p-id');
  sel.innerHTML = '';
  for (let y = 26; y >= 19; y--) sel.insertAdjacentHTML('beforeend', `<option value="${y}학번">${y}학번</option>`);
  $('p-name').value = profile?.name || '';
  $('p-major').value = profile?.major || '컴퓨터공학과';
  if (profile?.sid) sel.value = profile.sid;
  pickedAvatar = profile?.avatar || AVATARS[0];
  $('p-hero').innerHTML = panelHTML({ mascot: true, line: '안녕!\n반가워' });
  renderAvatars();
  $('p-error').textContent = '';
  show('s-profile');
}

function renderAvatars() {
  $('p-avatars').innerHTML = AVATARS.map((a) =>
    `<button type="button" class="${a === pickedAvatar ? 'sel' : ''}" data-a="${a}">${a}</button>`).join('');
}

$('p-avatars').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  pickedAvatar = b.dataset.a;
  renderAvatars();
});

$('p-save').addEventListener('click', () => {
  const name = $('p-name').value.trim();
  if (!name) { $('p-error').textContent = '이름을 입력해 주세요.'; return; }
  profile = { name, major: $('p-major').value, sid: $('p-id').value, avatar: pickedAvatar };
  store.set(KEY_PROFILE, profile);
  openHome();
});

/* ========================= 홈 ========================= */
function collectedSet() { return new Set(results.map((r) => r.type)); }

function openHome() {
  $('h-ava').textContent = profile.avatar;
  $('h-name').textContent = profile.name;
  $('h-meta').innerHTML = `<span class="chip">${esc(profile.major)}</span><span class="chip lav">${esc(profile.sid)}</span>`;
  $('h-hero').innerHTML = panelHTML({ mascot: true, line: 'hello\nworld' });
  const n = collectedSet().size;
  $('h-collect').textContent = `결과 도감 ${n} / ${TYPE_ORDER.length} 수집`;
  $('h-collect-bar').style.width = `${(n / TYPE_ORDER.length) * 100}%`;
  show('s-home');
}

$('h-start').addEventListener('click', () => startGame(null));
$('h-collection').addEventListener('click', openCollection);
$('h-edit').addEventListener('click', openProfile);

/* ========================= 게임 ========================= */
function startGame(target) {
  closeModal();
  game = { index: 0, scores: Object.fromEntries(TYPE_ORDER.map((k) => [k, 0])), target };
  renderQuestion();
  show('s-game');
}

// 목표 유형에 가장 점수가 높은 선택지 index (없으면 -1)
function bestOptionFor(q, type) {
  let best = -1, max = 0;
  q.options.forEach((o, i) => { const s = o.score[type] || 0; if (s > max) { max = s; best = i; } });
  return best;
}

function renderQuestion() {
  const q = QUESTIONS[game.index];
  const total = QUESTIONS.length;
  $('g-count').textContent = `${game.index + 1} / ${total}`;
  $('g-bar').style.width = `${(game.index / total) * 100}%`;
  $('g-year').textContent = q.year;
  $('g-scene').innerHTML = panelHTML({ mascot: true, emoji: q.emoji, call: `choose(${game.index + 1});` });
  $('g-question').innerHTML = esc(q.q.replace('{name}', profile.name)).replace(/\n/g, '<br>');
  $('g-target').innerHTML = game.target
    ? `<div class="target-note">🎯 목표: <b>${esc(TYPES[game.target].name)}</b> — 💡 표시된 선택지를 고르면 돼요</div>` : '';
  const hint = game.target ? bestOptionFor(q, game.target) : -1;
  $('g-options').innerHTML = q.options.map((o, i) =>
    `<button class="option ${i === hint ? 'hint' : ''}" data-i="${i}">${esc(o.t)}</button>`).join('');
}

$('g-options').addEventListener('click', (e) => {
  const b = e.target.closest('.option');
  if (!b) return;
  const opt = QUESTIONS[game.index].options[+b.dataset.i];
  for (const [k, v] of Object.entries(opt.score)) game.scores[k] += v;
  game.index++;
  if (game.index < QUESTIONS.length) renderQuestion();
  else finishGame();
});

$('g-quit').addEventListener('click', () => {
  if (confirm('진행 중인 게임을 그만둘까요?')) openHome();
});

function finishGame() {
  $('g-bar').style.width = '100%';
  // 최고 점수 유형 (동점이면 TYPE_ORDER 순서 우선)
  const type = TYPE_ORDER.reduce((best, k) => (game.scores[k] > game.scores[best] ? k : best), TYPE_ORDER[0]);
  const isNew = !collectedSet().has(type);
  const record = { type, name: profile.name, date: new Date().toISOString(), scores: game.scores };
  results.unshift(record);
  store.set(KEY_RESULTS, results);
  showResult(record, isNew, true);
}

/* ========================= 결과 팝업 ========================= */
function statsHTML(scores) {
  const max = Math.max(1, ...Object.values(scores));
  return `<div class="stats">${TYPE_ORDER.map((k) => `
    <div class="stat">
      <span>${TYPES[k].emoji} ${esc(TYPES[k].name)}</span>
      <div class="bar"><div style="width:${(scores[k] / max) * 100}%;background:${TYPES[k].color[0]}"></div></div>
      <span>${scores[k]}</span>
    </div>`).join('')}</div>`;
}

function showResult(record, isNew, fromGame) {
  const t = TYPES[record.type];
  $('modal').innerHTML = `
    <button class="close" data-close>✕</button>
    ${artHTML(record.type)}
    <p class="who">${esc(record.name)}님은…</p>
    <p class="pill-title">${esc(t.name)}</p>
    <div class="tags">${t.tags.map((x) => `<span>${esc(x)}</span>`).join('')}</div>
    <p class="desc">${esc(t.desc)}</p>
    ${record.scores ? statsHTML(record.scores) : ''}
    ${fromGame ? `<p class="saved">✔ 결과가 도감에 저장되었어요${isNew ? ' · 🎉 새로운 결과 획득!' : ''}</p>` : ''}
    <div class="btn-row">
      <button class="btn pink small" data-go="collection">📖 도감 보기</button>
      <button class="btn small" data-go="retry">🔄 다시 하기</button>
    </div>`;
  openModal();
}

/* ========================= 도감 ========================= */
function openCollection() {
  const counts = {};
  results.forEach((r) => { counts[r.type] = (counts[r.type] || 0) + 1; });

  $('c-grid').innerHTML = TYPE_ORDER.map((k) => {
    const t = TYPES[k];
    const got = counts[k] > 0;
    return `
      <button class="rcard ${got ? '' : 'locked'}" data-type="${k}">
        ${got ? panelHTML({ emoji: t.emoji, call: t.code }) : panelHTML({ emoji: '❓', call: 'unlock();', locked: true })}
        <div class="t">${got ? esc(t.name) : '???'}</div>
        <div class="c">${got ? `${counts[k]}회 획득` : '미획득 · 눌러서 힌트 보기'}</div>
      </button>`;
  }).join('');

  $('c-history').innerHTML = results.length
    ? results.map((r, i) => `
        <li data-i="${i}">
          <span>${TYPES[r.type].emoji} ${esc(TYPES[r.type].name)} <span class="d">· ${esc(r.name)}</span></span>
          <span class="d">${new Date(r.date).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
        </li>`).join('')
    : '<p class="empty">아직 기록이 없어요. 게임을 시작해 보세요!</p>';
  show('s-collection');
}

$('c-back').addEventListener('click', openHome);
$('c-grid').addEventListener('click', (e) => {
  const c = e.target.closest('.rcard');
  if (c) showGuide(c.dataset.type);
});
$('c-history').addEventListener('click', (e) => {
  const li = e.target.closest('li');
  if (li) showResult(results[+li.dataset.i], false, false);
});
$('c-clear').addEventListener('click', () => {
  if (!results.length || !confirm('모든 결과 기록을 삭제할까요?')) return;
  results = [];
  store.set(KEY_RESULTS, results);
  openCollection();
});

// 해당 결과가 나오게 하는 가이드라인
function showGuide(type) {
  const t = TYPES[type];
  const got = collectedSet().has(type);
  const steps = QUESTIONS.map((q, qi) => ({ q, i: bestOptionFor(q, type), qi }))
    .filter((s) => s.i >= 0);
  $('modal').innerHTML = `
    <button class="close" data-close>✕</button>
    ${artHTML(type, !got)}
    <p class="pill-title">${got ? esc(t.name) : '???'}</p>
    ${got ? '' : `<p class="who">힌트: ${esc(t.name)}</p>`}
    <div class="tags">${t.tags.map((x) => `<span>${esc(x)}</span>`).join('')}</div>
    ${got ? `<p class="desc">${esc(t.desc)}</p>` : '<p class="desc" style="text-align:center;color:var(--muted)">아직 획득하지 못한 결과예요.</p>'}
    <div class="guide">
      <h3>🧭 이 결과를 얻는 방법</h3>
      <ol>${steps.map((s) => `
        <li><span class="q">${esc(s.q.year)} · ${esc(s.q.q.replace('{name}', profile.name).split('\n').pop())}</span>
        ${esc(s.q.options[s.i].t)}</li>`).join('')}
      </ol>
      <p class="tip">💡 위 선택지를 많이 고를수록 이 결과가 나올 확률이 높아져요. (${steps.length}개 중 과반이면 거의 확정!)</p>
    </div>
    <button class="btn" data-target="${type}">🎯 이 결과를 목표로 도전하기</button>`;
  openModal();
}

/* ========================= 모달 공통 ========================= */
function openModal() { $('overlay').classList.add('open'); $('modal').scrollTop = 0; }
function closeModal() { $('overlay').classList.remove('open'); }

$('overlay').addEventListener('click', (e) => {
  if (e.target === $('overlay') || e.target.closest('[data-close]')) {
    closeModal();
    if ($('s-game').classList.contains('active')) openHome();
    return;
  }
  const go = e.target.closest('[data-go]');
  if (go) {
    closeModal();
    go.dataset.go === 'retry' ? startGame(null) : openCollection();
    return;
  }
  const tgt = e.target.closest('[data-target]');
  if (tgt) startGame(tgt.dataset.target);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('overlay').classList.contains('open')) closeModal();
});

/* ========================= 시작 ========================= */
profile ? openHome() : openProfile();
</script>
